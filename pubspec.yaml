name: wellguard_ai
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Location & Maps
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  
  # State Management
  provider: ^6.1.2
  
  # Date Formatting
  intl: ^0.20.2
  
  # Image Picker
  image_picker: ^1.0.7
  
  # Audio Recording & Playback
  record: ^6.0.0
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  
  # UI Enhancement Packages
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  iconsax_flutter: ^1.0.0
  animated_text_kit: ^4.2.2
  percent_indicator: ^4.2.3
  sliding_up_panel: ^2.0.0+1
  flutter_staggered_animations: ^1.1.1
  glassmorphism_ui: ^0.3.0
  simple_animations: ^5.0.2
  url_launcher: ^6.2.5
  haptic_feedback: ^0.5.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true

  assets:
    - lib/assests/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assests/logo.png"
  adaptive_icon_background: "#0A0F1E"
  adaptive_icon_foreground: "lib/assests/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
