name: wellguard_ai
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Location & Maps
  geolocator: ^13.0.2
